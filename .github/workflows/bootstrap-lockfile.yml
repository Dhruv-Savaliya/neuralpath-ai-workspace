name: Temporary npm lockfile refresh

on:
  push:
    branches:
      - feat/phase-6-learner-insights-clean
    paths:
      - "package.json"
      - ".github/workflows/bootstrap-lockfile.yml"

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm update --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh npm workspace lockfile"
          git fetch origin feat/phase-6-learner-insights-clean
          git rebase origin/feat/phase-6-learner-insights-clean
          git push origin HEAD:feat/phase-6-learner-insights-clean
